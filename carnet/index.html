<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnetización docente Táchira</title>
<meta name="robots" content="noindex">
<style>
:root{--navy:#0e2d5c;--purple:#583aa0;--pink:#c2457e;--bg:#f4f2fa;--card:#fff;--line:#e3dff0;--txt:#1d1b2a;--muted:#6b6880;
--ok:#1f7a45;--okbg:#e4f4ea;--warn:#8a5a00;--warnbg:#fdf1d8;--bad:#a12b2b;--badbg:#fbe6e6;--r:14px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(120deg,var(--navy),var(--purple) 70%,var(--pink));color:#fff;padding:18px 16px 22px;border-radius:0 0 22px 22px}
header .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}header h1{margin:4px 0 2px;font-size:21px;line-height:1.25}
header .s{font-size:14px;opacity:.9}main{max-width:720px;margin:0 auto;padding:14px 14px 260px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0}
.card h2{margin:0 0 6px;font-size:18px;color:var(--navy)}.muted{color:var(--muted);font-size:14px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:#ece9f6;color:var(--purple)}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:var(--navy);color:#fff;min-height:46px}
button.sec{background:#ece9f6;color:var(--navy)}button.peligro{background:var(--badbg);color:var(--bad)}button.ok{background:var(--ok)}
button:disabled{opacity:.45;cursor:not-allowed}.fila{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.full{width:100%}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px;color:var(--navy)}
#fNom,#fApe,#fOtro{text-transform:uppercase}
input,select,textarea{font:inherit;width:100%;padding:11px 12px;border:1px solid #cfc9e3;border-radius:10px;background:#fff;color:var(--txt)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--purple);border-color:transparent}
.err{background:var(--badbg);color:var(--bad);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px}
.aviso{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px}
.bien{background:var(--okbg);color:var(--ok);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px}
.persona{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.persona:first-child{border-top:0}.persona b{display:block;font-size:15px}.persona small{color:var(--muted)}
.vista{display:flex;gap:16px;flex-wrap:wrap}.vista .form{flex:1 1 300px;min-width:0}.vista .prev{flex:0 0 260px;margin:0 auto}@media(max-width:620px){.vista .prev{order:-1}.prev canvas{width:210px;margin:0 auto}}
.prev canvas{width:260px;height:auto;border-radius:10px;box-shadow:0 6px 24px rgba(14,45,92,.18);display:block;background:#eee}
.prev .t{font-size:13px;color:var(--muted);text-align:center;margin-top:6px}
.velo{position:fixed;inset:0;background:rgba(14,20,40,.45);display:flex;align-items:flex-start;justify-content:center;z-index:9;overflow-y:auto;padding:16px 0 40px;-webkit-overflow-scrolling:touch}
.velo .card{max-width:420px;width:92%}.oculto{display:none!important}
.barra{height:8px;background:#e6e2f3;border-radius:9px;overflow:hidden}.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--purple))}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tabs button{background:#fff;color:var(--navy);border:1px solid var(--line);min-height:40px;padding:8px 12px}
.tabs button.act{background:var(--navy);color:#fff}
@media(max-width:620px){.prev canvas{width:210px;margin:0 auto}}
html,body{overflow-x:hidden}.fila>input{min-width:0;flex:1 1 auto;width:auto}
</style>

</head><body><header><div class="k">Carnetización docente · Táchira</div><h1 id="hNom">Cargando…</h1><div class="s" id="hSub"></div></header>
<main id="app"><div class="card"><div class="muted">Abriendo su escuela…</div><div class="barra" style="margin-top:10px"><i style="width:40%"></i></div></div></main>

<div id="velo" class="velo oculto"><div class="card" id="veloC"></div></div>

<script src="qr.js?v=1"></script>
<script src="render.js?v=1"></script>
<script>
var API = 'https://script.google.com/macros/s/AKfycbymxmjlvceY5IaQkz28MOsvxwk7TNmNXQ5cKL92t6aA1-eiSxvRmFMFy54w_70ALltTzg/exec';
var PARAMS = (function(){ var q=new URLSearchParams(location.search); return { e:q.get('e')||'', k:q.get('k')||'' }; })();
var D = null, BG = {}, ESTADO = { vista: 'inicio' };
var AREAS = ['CULTURA','DEPORTE','TEATRO','DANZA','MÚSICA','ARTES PLÁSTICAS','LABORATORIO','COMPUTACIÓN','IDIOMAS','PTMS','EDUCACIÓN FÍSICA'];

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function bs(n){return Number(n).toLocaleString('es-VE');}
async function srv(fn){
  var a=[].slice.call(arguments,1), r, x;
  var veces = (fn==='inicio'||fn==='fotoPersona'||fn==='subirCapture') ? 2 : 1;   // solo se reintenta lo que no guarda nada
  for (var intento=0; intento<veces; intento++){
    try{ r = await fetch(API, {method:'POST', body: JSON.stringify({fn:fn, args:a}), headers:{'Content-Type':'text/plain;charset=utf-8'}}); x = await r.json(); break; }
    catch(e){ if (intento===veces-1) throw (fn==='inicio'||fn==='fotoPersona'||fn==='subirCapture') ? 'No hay conexión con el sistema. Revise su internet e intente de nuevo.' : 'Se cortó la conexión. Antes de repetir, recargue la página y revise si ya quedó guardado.'; await new Promise(function(ok){setTimeout(ok,1500);}); }
  }
  if (!x || !x.ok) throw (x && x.error) || 'El sistema no respondió. Intente de nuevo.';
  return x.data;
}
function montoVE(t){var s=String(t==null?'':t).replace(/[^\d,.-]/g,''),c=s.lastIndexOf(','),d=s.lastIndexOf('.');if(c>d&&!(d<0&&s.length-c-1===3))s=s.replace(/\./g,'').replace(',','.');else if(d>c&&s.length-d-1!==3)s=s.replace(/,/g,'');else s=s.replace(/[.,]/g,'');return Number(s);}
function img(src){return new Promise(function(ok,ko){var i=new Image();i.onload=function(){ok(i)};i.onerror=ko;i.src=src;});}
function velo(html){$('veloC').innerHTML=html;$('velo').classList.remove('oculto');}
function cerrarVelo(){$('velo').classList.add('oculto');}
function cargando(msg){velo('<h2>'+esc(msg||'Guardando…')+'</h2><div class="barra"><i style="width:70%"></i></div><p class="muted">No cierre esta página.</p>');}
function aviso(m){velo('<h2>Falta algo</h2><div class="err">'+esc(m)+'</div><button class="full" onclick="cerrarVelo()">Entendido</button>');}
function fallo(m){velo('<h2>No se pudo</h2><div class="err">'+esc(m)+'</div><button class="full" onclick="cerrarVelo()">Entendido</button>');}

async function arrancar(){
  if (!PARAMS.e || !PARAMS.k){ $('hNom').textContent='Enlace incompleto'; $('app').innerHTML='<div class="card"><div class="err">Este enlace está incompleto.</div><p class="muted">Abra el enlace completo que le enviaron por WhatsApp, o pida uno nuevo a la coordinación de carnetización.</p></div>'; return; }
  var letras = CARNET.loadFonts({reg:'assets/Inter-Regular.otf', bold:'assets/Inter-Bold.otf', xbold:'assets/Inter-ExtraBold.otf'});
  try{
    D = await srv('inicio', PARAMS.e, PARAMS.k);
  }catch(e){
    var malEnlace = /enlace/i.test(String(e));
    $('hNom').textContent = malEnlace ? 'Enlace no válido' : 'No se pudo abrir';
    $('app').innerHTML='<div class="card"><div class="err">'+esc(e)+'</div>'+(malEnlace?'<p class="muted">Pida un enlace nuevo a la coordinación de carnetización.</p>':'<button class="full" onclick="location.reload()">Intentar de nuevo</button>')+'</div>';
    return;
  }
  try{
    var pre = D.escuela.estatal ? 'EST_' : 'NAC_';
    var fondos = ['DOCENTE','ADMINISTRATIVO','OBRERO'].map(function(g){ return img('assets/'+pre+g+'.png').then(function(i){ BG[g]=i; }); });
    await Promise.all(fondos.concat([letras]));
  }catch(e){ $('app').innerHTML='<div class="card"><div class="err">No se pudieron cargar los diseños del carnet. Revise su internet.</div><button class="full" onclick="location.reload()">Intentar de nuevo</button></div>'; return; }
  pintar();
}
function refrescar(d){ if(d && d.escuela){ D=d; } pintar(); }

// ---------------------------------------------------------------- vistas
function pintar(){
  $('hNom').textContent = D.escuela.oficial;
  $('hSub').textContent = 'Municipio ' + D.escuela.municipio + ' · Código ' + D.escuela.codigo;
  if (ESTADO.vista === 'persona' || ESTADO.vista === 'pago') return;
  var h = '';
  var corr = D.lotes.filter(function(l){return l.tipo==='CORRECCION' && l.estado==='ABIERTO';});
  corr.forEach(function(l){ h += tarjetaCorreccion(l); });
  h += '<div class="card"><h2>Carnets nuevos</h2><p class="muted">Cada pago abre los cupos exactos. Precio: <b>'+bs(D.precio)+' Bs por carnet</b>.'+reglaPrecio()+' ' +
       'Pague solo cuando tenga los datos y la foto de <b>todas</b> las personas del grupo.</p>' +
       '<button class="full" onclick="formPago()">Registrar un pago nuevo</button></div>';
  D.lotes.filter(function(l){return l.tipo!=='CORRECCION';}).reverse().forEach(function(l){ h += tarjetaLote(l); });
  h += tarjetaContacto();
  $('app').innerHTML = h;
}
function tarjetaContacto(){
  var c = String(D.contacto||'').trim(); if (!c) return '';
  var tel = (c.match(/0(\d{3})[-\s.]?(\d{7})/) || []), wa = tel.length ? 'https://wa.me/58'+tel[1]+tel[2] : '';
  return '<div class="card"><h2>¿Dudas o algún error?</h2><p>Comuníquese directamente con la <b>'+esc(c)+'</b>.</p>'+
    (wa ? '<a class="btn full" style="display:block;text-align:center;text-decoration:none" href="'+wa+'" target="_blank" rel="noopener">Escribir por WhatsApp</a>' : '')+'</div>';
}

function chipLote(l){
  var m={'PAGO EN ESPERA':'warn','ABIERTO':'','TERMINADO':'ok','PDF GENERADO':'ok','IMPRESO':'ok','PAGO RECHAZADO':'bad'};
  var t={'PAGO EN ESPERA':'Pago en espera','ABIERTO':'Pago confirmado','TERMINADO':'Enviado a revisión','PDF GENERADO':'En revisión','IMPRESO':'Impreso','PAGO RECHAZADO':'Pago rechazado'};
  return '<span class="chip '+(m[l.estado]||'')+'">'+(t[l.estado]||l.estado)+'</span>';
}
function personasDe(lote){ return D.personas.filter(function(p){return p.lote===lote;}); }

function tarjetaLote(l){
  var ps = personasDe(l.lote), abierto = ['PAGO EN ESPERA','ABIERTO'].indexOf(l.estado)>=0;
  var h = '<div class="card"><div class="fila" style="justify-content:space-between"><h2>Grupo de '+l.cupos+' carnet'+(l.cupos>1?'s':'')+'</h2>'+chipLote(l)+'</div>';
  var et={'EN ESPERA':'<span class="chip warn">en espera</span>','CONFIRMADO':'<span class="chip ok">confirmado</span>','RECHAZADO':'<span class="chip bad">rechazado</span>','ANULADO':'<span class="chip">anulado</span>'};
  var porReemplazar = (l.pagos||[]).filter(function(t){ return t.estado==='RECHAZADO' && !t.reemplazada && l.estado==='PAGO EN ESPERA'; });
  var vivas = (l.pagos||[]).filter(function(t){ return !t.reemplazada; }), muchas = vivas.length>5, lista='';
  if (muchas) { var cu={}; vivas.forEach(function(t){ cu[t.estado]=(cu[t.estado]||0)+1; });
    h += '<div class="muted">'+vivas.length+' transferencias · '+bs(vivas.reduce(function(a,t){return a+t.monto;},0))+' Bs · '+Object.keys(cu).map(function(k){return cu[k]+' '+(({'EN ESPERA':'en espera','CONFIRMADO':'confirmadas','RECHAZADO':'rechazadas'})[k]||k.toLowerCase());}).join(', ')+'</div>'; }
  vivas.forEach(function(t){
    var pend = porReemplazar.indexOf(t)>=0;
    var linea = '<div class="muted">Transferencia ref. …'+esc(String(t.ref).slice(-6))+' · '+bs(t.monto)+' Bs'+(t.fecha?' · '+esc(t.fecha):'')+' '+(vivas.length>1||pend?(et[t.estado]||''):'')+'</div>';
    if (muchas && !pend) { lista += linea; return; }
    h += linea;
    if (pend) h += '<div class="err" style="margin:6px 0">La coordinación rechazó esta transferencia'+(t.nota?': '+esc(t.nota):'')+'. Suba la transferencia correcta en su lugar; las demás siguen igual.<button class="full" style="margin-top:8px" onclick="formReemplazo(\''+esc(l.lote)+'\',\''+esc(t.id)+'\')">Subir la transferencia correcta</button></div>';
  });
  if (lista) h += '<details style="margin:4px 0"><summary class="muted" style="cursor:pointer">Ver todas las transferencias</summary>'+lista+'</details>';
  if (l.estado==='PAGO EN ESPERA' && !porReemplazar.length) h += '<div class="aviso">El pago se confirma cuando la coordinación carga el estado de cuenta (todos los días después de la 1:00 p. m.'+(D.ultimaCarga?'; última carga: '+esc(D.ultimaCarga):'')+'). Mientras tanto ya puede cargar a su personal.</div>';
  if (l.estado==='PAGO RECHAZADO') { var rj=(l.pagos||[]).filter(function(t){return t.estado==='RECHAZADO';})[0]; h += '<div class="err">La coordinación no encontró este pago'+(rj?' (ref. …'+esc(String(rj.ref).slice(-6))+')':'')+'. '+esc(rj&&rj.nota||'')+' Registre el pago de nuevo con los datos correctos.</div>'; }
  h += '<div class="barra" style="margin:10px 0"><i style="width:'+Math.round(100*ps.length/l.cupos)+'%"></i></div><div class="muted">'+ps.length+' de '+l.cupos+' cargados</div>';
  ps.forEach(function(p){
    var est = p.estado==='POR APROBAR' ? '<span class="chip warn">Esperando aprobación</span>' : '';
    h += '<div class="persona"><div><b>'+esc(p.nombres+' '+p.apellidos)+'</b><small>'+esc(p.nac+'-'+p.cedula+' · '+p.cargo)+'</small> '+est+'</div>' +
         (abierto ? '<div class="fila"><button class="sec" onclick="editar('+p.fila+')">Ver / editar</button></div>' : '<button class="sec" onclick="verCarnet('+p.fila+')">Ver</button>') + '</div>';
  });
  if (abierto) h += avisoRechazados(l, 'Corrija lo indicado y cárguela de nuevo con «Agregar persona» en este mismo grupo.');
  if (abierto && ps.length < l.cupos) h += '<button class="full" style="margin-top:10px" onclick="nueva(\''+l.lote+'\')">+ Agregar persona ('+(l.cupos-ps.length)+' cupo'+(l.cupos-ps.length>1?'s':'')+' libre'+(l.cupos-ps.length>1?'s':'')+')</button>';
  if (abierto) {
    var listo = l.estado==='ABIERTO' && ps.length===l.cupos && !ps.some(function(p){return p.estado==='POR APROBAR';});
    h += '<button class="full ok" style="margin-top:10px" '+(listo?'':'disabled')+' onclick="terminar(\''+l.lote+'\')">Terminar y enviar a la coordinación</button>';
    if (!listo) h += '<p class="muted" style="margin:6px 0 0">Se activa cuando el pago esté confirmado, estén cargados los '+l.cupos+' y no haya nada esperando aprobación.</p>';
  }
  return h + '</div>';
}

// Personas que la coordinación no aprobó, con el motivo (D.rechazados no existe con el servidor viejo).
function avisoRechazados(l, queHacer){
  return (D.rechazados||[]).filter(function(r){return r.lote===l.lote;}).map(function(r){
    return '<div class="err" style="margin-top:8px"><b>No aprobado por la coordinación:</b> '+esc(r.nombres+' '+r.apellidos)+' ('+esc(r.nac+'-'+r.cedula)+')'+
           (r.motivo?'<br>Motivo: '+esc(r.motivo):'')+'<br>'+queHacer+'</div>';
  }).join('');
}
function tarjetaCorreccion(l){
  var ps = personasDe(l.lote), falta = ps.filter(function(p){return p.estado==='CORREGIR';}).length;
  var h = '<div class="card" style="border:2px solid #f0c36a"><div class="fila" style="justify-content:space-between"><h2>Correcciones pendientes</h2><span class="chip warn">'+falta+' por corregir</span></div>' +
          '<p class="muted">Estos carnets no se pudieron imprimir por los errores indicados. Corrija cada uno, revise el carnet y guárdelo. Las correcciones no se cobran.</p>';
  ps.forEach(function(p){
    var listo = p.estado==='CORREGIDO';
    h += '<div class="persona"><div><b>'+esc(p.nombres+' '+p.apellidos)+'</b><small>'+esc(p.nac+'-'+p.cedula)+'</small>' +
         '<div class="'+(listo?'bien':'aviso')+'" style="margin:6px 0 0;padding:6px 10px">'+(listo?'Corregido ✓':esc(p.problema||'Revisar datos'))+'</div></div>' +
         '<button class="'+(listo?'sec':'')+'" onclick="editar('+p.fila+')">'+(listo?'Ver':'Corregir')+'</button></div>';
  });
  h += avisoRechazados(l, 'En una corrección no se pueden agregar personas: comuníquese con la coordinación (contacto al final de la página).');
  h += '<button class="full ok" style="margin-top:12px" '+(falta?'disabled':'')+' onclick="terminar(\''+l.lote+'\')">Terminar correcciones y enviar</button>';
  return h + '</div>';
}

// ---------------------------------------------------------------- pago
function reglaPrecio(){
  var P=D.precios||{}; if(!P.desde || P.base===P.nuevo) return '';
  return ' Las transferencias hechas hasta el <b>'+fechaVE(diaAntes(P.desde))+'</b> valen <b>'+bs(P.base)+' Bs</b> por carnet; desde el <b>'+fechaVE(P.desde)+'</b>, <b>'+bs(P.nuevo)+' Bs</b>.';
}
function fechaVE(iso){ var m=String(iso||'').split('-'); return m.length===3? m[2]+'/'+m[1]+'/'+m[0] : String(iso||''); }
function diaAntes(iso){ var p=iso.split('-'), d=new Date(+p[0],+p[1]-1,+p[2]-1); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function precioEn(iso){ var P=D.precios||{base:D.precio}; return (P.desde && iso && iso>=P.desde) ? P.nuevo : P.base; }

var MAXT = 300, NB = 0, BANCOS = ['Banco de Venezuela','Banesco','Mercantil','Provincial (BBVA)','Bicentenario','Banco del Tesoro','Bancaribe','BNC (Nacional de Crédito)','Exterior','Banco Plaza','Venezolano de Crédito','Sofitasa','Banco Activo','Bancamiga','100% Banco','Banplus','Fondo Común (BFC)','Banco Caroní','Banco Agrícola','Del Sur','Otro'];
var SUBIDOS = {};   // capture ya subido por casilla: {i: {file, id}} (si algo falla, no se vuelve a subir)
function bloque(i){
  var d=document.createElement('div'); d.className='card'; d.id='tB'+i; d.style.cssText='margin:12px 0;background:#faf9fe';
  d.innerHTML='<h2 style="font-size:16px">Transferencia '+(i+1)+'</h2>'+
   '<label>Monto que transfirió (Bs)</label><input id="tM'+i+'" inputmode="decimal" oninput="resumenPago()">'+
   '<label>Fecha de la transferencia</label><input id="tF'+i+'" type="date" max="'+esc(D.hoy||'')+'" onchange="resumenPago()" oninput="resumenPago()">'+
   '<div class="muted" id="tV'+i+'"></div>'+
   '<label>Número de referencia completo</label><input id="tR'+i+'" inputmode="numeric">'+
   '<label>Banco desde donde pagó</label><select id="tBa'+i+'"><option value="">— elija —</option>'+BANCOS.map(function(b){return '<option>'+esc(b)+'</option>';}).join('')+'</select>'+
   '<label>Cuenta a la que pagó</label><select id="tC'+i+'"><option value="">— elija —</option><option value="Virginia">María Virginia Duque</option><option value="Edison">Edison Méndez</option><option value="Rossy">Rossy Daniela Camargo</option></select>'+
   '<label>Capture de esta transferencia</label><input id="tK'+i+'" type="file" accept="image/*"><div class="muted">Toque la casilla y elija la foto del capture en su galería.</div>';
  return d;
}
function formPago(){
  var c = D.cuentas.length ? '<div class="muted" style="white-space:pre-line;margin-bottom:6px">'+esc(D.cuentas.join('\n\n'))+'</div>' : '';
  ESTADO.vista='pago'; NB=0; SUBIDOS={}; window.scrollTo(0,0);
  $('app').innerHTML=('<div class="card"><div class="fila" style="justify-content:space-between"><h2>Registrar pago</h2><button class="sec" onclick="volver()">← Volver</button></div>'+c+
   '<p class="muted">Precio: <b>'+bs(D.precio)+' Bs por carnet</b>.'+reglaPrecio()+'</p>'+
   '<label>¿Cuántos carnets paga?</label><input id="pCant" type="number" min="1" inputmode="numeric" oninput="resumenPago()">'+
   '<label>¿En cuántas transferencias pagó?</label><input id="pNT" type="number" min="1" max="'+MAXT+'" value="1" inputmode="numeric" oninput="verBloques()">'+
   '<div class="muted">Si pagó el total de una vez, deje 1. Si pagaron por partes (por ejemplo, cada persona su carnet), escriba cuántas transferencias son y llene cada una con su capture.</div>'+
   '<div id="tLista"></div>'+

function nT(){ var n=Math.floor(+$('pNT').value||1); return Math.max(1, Math.min(MAXT, n)); }
function verBloques(){
  var n=nT(), L=$('tLista');
  while (NB<n){ var b=bloque(NB); L.appendChild(b);
    if (NB>0){ $('tC'+NB).value=$('tC0').value; }   // la cuenta se copia de la primera; se puede cambiar
    NB++; }

function leerTransf(){
  var T=[]; for (var i=0;i<nT();i++) T.push({ i:i, monto:montoVE($('tM'+i).value), fecha:$('tF'+i).value, referencia:$('tR'+i).value, banco:$('tBa'+i).value, cuenta:$('tC'+i).value, file:$('tK'+i).files[0] });
  return T;
}
function resumenPago(){
  if (!$('pRes') || !$('tB0')) return;
  var cant=+$('pCant').value||0, T=leerTransf(), valor=0, total=0, faltan=0;
  T.forEach(function(t){
    var p = t.fecha ? precioEn(t.fecha) : 0;
    $('tV'+t.i).innerHTML = t.fecha ? 'Para esta fecha: '+bs(p)+' Bs por carnet' : '';
    if (!(t.monto>0) || !t.fecha) { faltan++; return; }
    total += t.monto; valor += t.monto/p;
  });
  var v = Math.round(valor*100)/100, h='';
  if (!cant) h = '';
  else if (faltan) h = '<div class="aviso">Faltan el monto o la fecha en '+faltan+' transferencia(s). Llénelas todas para ver si cuadra con '+cant+' carnet(s).'+(total?' Van '+bs(total)+' Bs.':'')+'</div>';
  else if (Math.abs(valor-cant)<=0.001) h = '<div class="bien">Cuadra: '+bs(total)+' Bs = '+cant+' carnet(s). ✓</div>';
  else h = '<div class="err">No cuadra: lo transferido ('+bs(total)+' Bs) alcanza para '+v.toLocaleString('es-VE')+' carnet(s) y usted indicó '+cant+'.</div>';

}
async function enviarPago(){
  var cant=+$('pCant').value, T=leerTransf();

  if(!cant || cant<1 || cant!==Math.floor(cant)) return err('Indique cuántos carnets paga.');
  var valor=0, refs={};
  for (var i=0;i<T.length;i++){
    var t=T[i], n = T.length>1 ? ' (transferencia '+(i+1)+')' : '';
    if(!(t.monto>0)) return err('Escriba el monto'+n+'.');
    if(!t.fecha) return err('Indique la fecha'+n+'.');

    var r=String(t.referencia).replace(/\D/g,''); if(r.length<6) return err('Escriba la referencia completa'+n+'.');
    var kr=r.slice(-6)+'|'+t.monto+'|'+t.fecha, rep=refs[r]||refs[kr];
    if(rep) return err('La referencia'+n+' está repetida (es igual a la de la transferencia '+rep+').'); refs[r]=refs[kr]=i+1;
    if(!t.banco) return err('Elija el banco desde donde pagó'+n+'.');
    if(!t.cuenta) return err('Indique a qué cuenta pagó'+n+'.');
    if(!t.file) return err('Suba el capture'+n+'.');
    valor += t.monto/precioEn(t.fecha);
  }
  if (Math.abs(valor-cant)>0.001) return err('Lo transferido alcanza para '+(Math.round(valor*100)/100).toLocaleString('es-VE')+' carnet(s) y usted indicó '+cant+'. Revise los montos y las fechas.'+(reglaPrecio()?' Recuerde: '+reglaPrecio().replace(/<[^>]+>/g,''):''));
  velo('<h2>Registrando pago…</h2><div class="barra"><i id="pBar" style="width:5%"></i></div><p class="muted" id="pBarT">Preparando…</p><p class="muted">No cierre esta página.</p>');
  try{
    var datos={cantidad:cant, transferencias:[]};

      var s = SUBIDOS[T[j].i];

        var up = await srv('subirCapture', PARAMS.e, PARAMS.k, cap.url, T[j].referencia);
        s = SUBIDOS[T[j].i] = { file:T[j].file, id:up.id };

      datos.transferencias.push({monto:T[j].monto, fecha:T[j].fecha, referencia:T[j].referencia, banco:T[j].banco, cuenta:T[j].cuenta, captureId:s.id});
    }

    var r = await srv('registrarPago', PARAMS.e, PARAMS.k, datos); ESTADO.vista='inicio'; SUBIDOS={}; refrescar(r); cerrarVelo(); window.scrollTo(0,0);
  }catch(e){ cerrarVelo(); err(e); }
}

      s=SUBIDOS[0]={file:t.file, id:(await srv('subirCapture', PARAMS.e, PARAMS.k, cap.url, t.referencia)).id}; }

// ---------------------------------------------------------------- fotos
async function leerImg(file){ var url=URL.createObjectURL(file); var i=await img(url); return i; }
async function reducir(file, mw, mh, q){
  var i = await leerImg(file), w=i.naturalWidth, h=i.naturalHeight, k=Math.min(1, mw/w, mh/h);
  var c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
  c.getContext('2d').drawImage(i,0,0,c.width,c.height);
  return { url:c.toDataURL('image/jpeg', q), w:w, h:h, img:i };
}
function revisarFoto(r){
  var prob=[];
  if (r.w < 400 || r.h < 480) prob.push('La foto es muy pequeña ('+r.w+'×'+r.h+' píxeles). Se verá borrosa en el carnet. Tome una foto nueva con la cámara del teléfono, no una captura de pantalla.');
  var c=document.createElement('canvas'); c.width=40; c.height=50; var x=c.getContext('2d'); x.drawImage(r.img,0,0,40,50);
  var d=x.getImageData(0,0,40,50).data, s=0; for(var i=0;i<d.length;i+=4) s+=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
  if (s/(d.length/4) < 70) prob.push('La foto está muy oscura. Tómela con buena luz, de frente, en una pared clara.');
  if (r.h < r.w) prob.push('La foto está acostada o es horizontal. Debe ser vertical, de pecho hacia arriba.');
  return prob;
}

  var n = personasDe(lote).length;
  velo('<h2>Terminar y enviar</h2><p>Se enviarán <b>'+n+' carnet(s)</b> a la coordinación para imprimir. Después de enviar ya no podrá cambiarlos.</p>'+
   '<label style="font-weight:500"><input type="checkbox" id="tOk" style="width:auto"> Revisé cada carnet: nombres, apellidos, cédulas, cargos y fotos están correctos.</label>'+
   '<label>Su nombre y apellido</label><input id="tNom"><label>Su cédula</label><input id="tCed" inputmode="numeric">'+
   '<div id="tErr"></div><div class="fila" style="margin-top:12px"><button class="sec" onclick="cerrarVelo()">Cancelar</button><button class="ok" onclick="confirmarTerminar(\''+lote+'\')">Enviar</button></div>');
}
async function confirmarTerminar(lote){
  if(!$('tOk').checked){ $('tErr').innerHTML='<div class="err">Marque la casilla para confirmar que revisó los carnets.</div>'; return; }
  var nom=$('tNom').value, ced=$('tCed').value;
  cargando('Enviando…');
  try{ refrescar(await srv('terminarLote', PARAMS.e, PARAMS.k, lote, nom, ced)); velo('<h2>Enviado</h2><div class="bien">La coordinación recibió sus carnets. Le avisarán cuando estén impresos.</div><button class="full" onclick="cerrarVelo()">Listo</button>'); }
  catch(e){ fallo(e); }
}

arrancar();
</script>
